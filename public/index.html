<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Duo Days, um espaco privado para duas pessoas.">
  <title>Duo Days | Esse espaco e nosso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <main class="login-shell">
    <section class="welcome-panel" aria-label="Duo Days">
      <p class="eyebrow">UM ESPACO SO NOSSO</p>
      <h1>Duo<br><em>Days.</em></h1>
      <p class="welcome-copy">Pequenos dias. Grandes historias. Tudo que importa, guardado entre nos dois.</p>
      <div class="orbit" aria-hidden="true"><span>82</span><small>dias<br>juntos</small></div>
    </section>
    <section class="login-panel">
      <div class="login-heading"><p class="eyebrow">BEM-VINDOS DE VOLTA</p><h2>Entrar no<br><strong>nosso espaco</strong></h2></div>
      <form id="login-form" novalidate>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button type="submit">Entrar <span aria-hidden="true">&rarr;</span></button>
      </form>
      <p class="privacy-note"><span aria-hidden="true">&#9829;</span> Feito para duas pessoas. E somente duas.</p>
    </section>
  </main>
  <script src="/js/auth.js" defer></script>
</body>
</html>
